<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaGradWith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="deltaAccentWith" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <filter id="deltaShadowWith" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.28" />
    </filter>
    <style>
      .delta-brand-text {
        fill: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .delta-brand-subtext {
        fill: #7c3aed;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .delta-brand-text {
          fill: #f8fafc;
        }
        .delta-brand-subtext {
          fill: #a78bfa;
        }
      }
    </style>
  </defs>

  <!-- Delta Icon Mark -->
  <g transform="translate(6, 4)">
    <!-- Outer Delta Structure -->
    <polygon points="28,8 49,48 7,48" fill="none" stroke="url(#deltaGradWith)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#deltaShadowWith)" />
    <!-- Inner Core Prism -->
    <polygon points="28,19 41,43 15,43" fill="url(#deltaGradWith)" opacity="0.16" />
    <!-- Connected Apex & Base Nodes -->
    <circle cx="28" cy="8" r="3.8" fill="#C084FC" />
    <circle cx="49" cy="48" r="3.8" fill="#7C3AED" />
    <circle cx="7" cy="48" r="3.8" fill="#5B21B6" />
    <!-- Pulse Center Core -->
    <circle cx="28" cy="33" r="2.8" fill="url(#deltaAccentWith)" />
  </g>

  <!-- DELTA Wordmark (Vector Typography) -->
  <text x="74" y="38" class="delta-brand-text" font-size="29" font-weight="800" letter-spacing="0.06em">DELTA</text>

  <!-- Subtitle: EVERYTHING CONNECTS -->
  <text x="75" y="52" class="delta-brand-subtext" font-size="8.5" font-weight="700" letter-spacing="0.22em">EVERYTHING CONNECTS</text>

  <!-- Subtle Web Badge Capsule -->
  <rect x="186" y="21" width="36" height="18" rx="9" fill="#7C3AED" fill-opacity="0.12" />
  <text x="204" y="33" text-anchor="middle" class="delta-brand-subtext" font-size="9" font-weight="700" letter-spacing="0.05em">WEB</text>
</svg>
