<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="deltaAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <filter id="deltaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Delta Polygon -->
  <polygon points="50,14 86,82 14,82" fill="none" stroke="url(#deltaGrad)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#deltaShadow)" />
  
  <!-- Inner Connecting Core Structure: 'Everything connects' -->
  <path d="M 50,30 L 72,74 L 28,74 Z" fill="url(#deltaGrad)" opacity="0.15" />
  
  <!-- Connecting Node 1: Apex (Signal/Origin) -->
  <circle cx="50" cy="14" r="6" fill="#C084FC" />
  
  <!-- Connecting Node 2: Right Base (Team/World) -->
  <circle cx="86" cy="82" r="6" fill="#7C3AED" />

  <!-- Connecting Node 3: Left Base (Privacy/User) -->
  <circle cx="14" cy="82" r="6" fill="#5B21B6" />
  
  <!-- Central Pulse Nucleus -->
  <circle cx="50" cy="58" r="4.5" fill="url(#deltaAccentGrad)" />
</svg>
